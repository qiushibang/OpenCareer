# App CI — backend, GUI units, and the real local-distribution browser gate.
# The inherited desktop English-selector suite remains available manually;
# it is not the current localized Career product acceptance suite.

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,bedrock,cloud]"
      - name: Test
        run: python -m pytest tests -q
      - name: Career domain tests (OCR packaging has its own gate)
        run: python -m pytest extensions/career_mcp/tests -m 'not ocr_acceptance' -q

  local-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install source dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix surfaces/gui
      - name: Local startup, isolation, origins and restart persistence
        run: OPENCAR_TEST_LOCAL_INSTALL=1 python -m pytest tests/test_local_launcher.py tests/test_local_installation.py -q

  source-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current source without exporting secret values
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact=100 --config /repo/.gitleaks.toml /repo

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Unit tests
        working-directory: surfaces/gui
        run: npm test -- --maxWorkers=2
      - name: Audit build and runtime dependencies
        working-directory: surfaces/gui
        run: npm audit --audit-level=moderate

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        run: |
          python -m pip install -e '.[dev]' playwright
          python -m playwright install --with-deps chromium
      - name: e2e
        run: OPENCAR_TEST_LOCAL_BROWSER=1 python -m pytest tests/test_local_browser.py -q
