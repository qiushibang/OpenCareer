[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworker-career-mcp"
version = "0.1.0"
description = "Career domain MCP extension for OpenWorker"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.1,<2",
    "pypdf>=5",
    "pypdfium2>=4",
    "rapidocr==3.9.2",
    "onnxruntime==1.19.2",
    "opencv-python==4.10.0.84",
    "numpy==1.26.4",
    "python-docx>=1.1,<2",
]
